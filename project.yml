name: DeskStyle
options:
  bundleIdPrefix: app.deskstyle
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "16.0"
  projectFormat: xcode16_0
  createIntermediateGroups: true
  groupSortPosition: top
  usesTabs: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SDKROOT: iphoneos
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    "CODE_SIGN_IDENTITY[sdk=iphoneos*]": ""
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_BITCODE: NO
    ENABLE_PREVIEWS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    VALIDATE_PRODUCT: NO
    COPY_PHASE_STRIP: NO
    STRIP_INSTALLED_PRODUCT: NO
    DEPLOYMENT_POSTPROCESSING: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_EMIT_LOC_STRINGS: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    GENERATE_INFOPLIST_FILE: NO

configs:
  Debug: debug
  Release: release

targets:
  DeskStyle:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DeskStyle
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.deskstyle.ios
        PRODUCT_NAME: DeskStyle
        INFOPLIST_FILE: DeskStyle/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - target: DeskStyleWidget
        embed: true
        link: false
        codeSign: false
        copy:
          destination: plugins

  DeskStyleWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DeskStyleWidget
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.deskstyle.ios.widget
        PRODUCT_NAME: DeskStyleWidget
        INFOPLIST_FILE: DeskStyleWidget/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  DeskStyle:
    build:
      targets:
        DeskStyle: all
        DeskStyleWidget: all
      parallelizeBuild: true
      buildImplicitDependencies: true
    run:
      config: Release
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
